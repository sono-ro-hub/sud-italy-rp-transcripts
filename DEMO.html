<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcript • Demo</title>
<style>
body{margin:0;background:#0b0d10;color:#f2f3f5;font-family:Inter,system-ui,sans-serif}.head{padding:25px 6%;border-bottom:1px solid #252b33;background:#11151a}.head h1{margin:0 0 7px}.muted{color:#9da3ad}.chat{max-width:900px;margin:35px auto;padding:0 20px}.msg{display:flex;gap:13px;padding:12px 0}.avatar{width:42px;height:42px;border-radius:50%;background:#5865f2;flex:none}.name{font-weight:700}.time{font-size:12px;color:#777e89;margin-left:7px}.content{margin-top:5px;line-height:1.5;white-space:pre-wrap}.box{border:1px solid #252b33;background:#11151a;border-radius:12px;padding:18px;margin-bottom:25px}
</style>
</head>
<body>
<header class="head"><h1>🎫 Transcript Ticket Demo</h1><div class="muted">Sud Italy RP • Trascrizione</div></header>
<main class="chat">
<div class="box"><b>Ticket</b><br><span class="muted">Questa è una pagina demo. Il bot potrà creare automaticamente pagine simili.</span></div>
<div class="msg"><div class="avatar"></div><div><span class="name">Utente</span><span class="time">oggi</span><div class="content">Salve, ho bisogno di assistenza.</div></div></div>
<div class="msg"><div class="avatar"></div><div><span class="name">Staff</span><span class="time">oggi</span><div class="content">Certo, dimmi pure.</div></div></div>
</main>
</body>
</html>
