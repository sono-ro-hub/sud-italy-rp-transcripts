<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sud Italy RP • Trascrizioni</title>
  <meta name="description" content="Trascrizioni dei ticket di Sud Italy RP">
  <style>
    :root{--bg:#0b0d10;--panel:#11151a;--panel2:#171b21;--text:#f2f3f5;--muted:#a8adb5;--line:#252b33;--accent:#5865f2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b24 0,#0b0d10 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
    .wrap{width:min(1050px,92%);margin:auto}.top{padding:70px 0 30px;text-align:center}.badge{display:inline-block;border:1px solid var(--line);background:#12161c;padding:8px 13px;border-radius:999px;color:#c9cdd4;font-size:13px}
    h1{font-size:clamp(34px,6vw,62px);margin:18px 0 10px;letter-spacing:-2px}.lead{color:var(--muted);max-width:650px;margin:auto;line-height:1.7}
    .search{margin:35px auto 45px;display:flex;gap:10px;max-width:720px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;color:white;outline:none;font-size:15px}.search button{border:0;border-radius:13px;background:var(--accent);color:white;font-weight:700;padding:0 23px;cursor:pointer}
    .card{background:rgba(17,21,26,.9);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:30px}.card h2{margin-top:0}.hint{color:var(--muted);line-height:1.7}
    footer{padding:30px 0 45px;text-align:center;color:#777e89;font-size:13px}
    @media(max-width:600px){.search{flex-direction:column}.search button{height:48px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <span class="badge">🎫 SUD ITALY RP</span>
      <h1>Trascrizioni Ticket</h1>
      <p class="lead">Visualizza le trascrizioni dei ticket chiusi in modo semplice e ordinato.</p>
      <form class="search" id="search">
        <input id="ticketId" placeholder="Inserisci l'ID della trascrizione..." autocomplete="off">
        <button>Visualizza</button>
      </form>
    </section>
    <section class="card">
      <h2>Come funziona</h2>
      <p class="hint">Inserisci l'identificativo del ticket e il sito aprirà la relativa pagina nella cartella <b>transcripts</b>.</p>
    </section>
  </main>
  <footer>Sud Italy RP • Ticket Transcripts</footer>
  <script>
    document.getElementById("search").addEventListener("submit", e=>{
      e.preventDefault();
      const id=document.getElementById("ticketId").value.trim();
      if(!id) return;
      if(!/^[A-Za-z0-9_-]+$/.test(id)) return alert("ID non valido.");
      location.href="transcripts/"+encodeURIComponent(id)+".html";
    });
  </script>
</body>
</html>
